<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #0d0f14;
      color: #e8e8ea;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      padding: 14px;
    }
    h1 {
      font-size: 14px; color: #f97316; margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; color: #9a9aa2; font-size: 11px; margin-bottom: 4px;
    }
    .field input[type="number"] {
      width: 100%; padding: 6px 8px;
      background: #1a1f2a; border: 1px solid #3d5a74;
      color: #7fdcff; font-family: monospace; font-size: 13px;
      border-radius: 4px; outline: none;
    }
    .field input[type="number"]:focus { border-color: #f97316; }
    .field .hint { font-size: 10px; color: #5a5a62; margin-top: 2px; }
    .status {
      display: flex; align-items: center; gap: 6px;
      margin: 10px 0; padding: 8px;
      background: #1a1f2a; border-radius: 4px;
      font-size: 11px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex: none;
    }
    .dot.on { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.5); }
    .dot.off { background: #5a5a62; }
    .dot.err { background: #f87171; }
    button {
      width: 100%; padding: 8px;
      background: transparent; border: 1px solid #f97316;
      color: #f97316; font-size: 12px;
      border-radius: 4px; cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: rgba(249,115,22,.15); }
    .msg {
      text-align: center; font-size: 11px; color: #00ff66;
      margin-top: 8px; min-height: 13px;
    }
    .divider { border-top: 1px solid #1e2430; margin: 10px 0; }
    .info { font-size: 10px; color: #5a5a62; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🎧 SC Overlay Bridge</h1>

  <div class="status">
    <span class="dot off" id="wsDot"></span>
    <span id="wsStatus">проверяю соединение…</span>
  </div>

  <div class="field">
    <label>Порт WebSocket</label>
    <input type="number" id="port" min="1024" max="65535" value="8765">
    <div class="hint">Должен совпадать с портом оверлея (OVERLAY_PORT)</div>
  </div>

  <div class="field">
    <label>Интервал опроса (мс)</label>
    <input type="number" id="interval" min="500" max="5000" step="100" value="1200">
    <div class="hint">Как часто читать состояние трека из DOM</div>
  </div>

  <button onclick="save()">💾 Сохранить</button>
  <div class="msg" id="msg"></div>

  <div class="divider"></div>
  <div class="info">
    Оверлей должен быть запущен.<br>
    Если статус красный — проверь, что SoundCloud Overlay работает.
  </div>

  <script src="popup.js"></script>
</body>
</html>
